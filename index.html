<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시설물 점검 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #f4f6f9; --card-bg: #ffffff; --text-main: #333333; --border-color: #e2e8f0; --accent-blue: #3b82f6; }
        body { margin: 0; padding: 20px; font-family: 'Malgun Gothic', dotum, sans-serif; background: var(--bg-dark); color: var(--text-main); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); flex-wrap: nowrap; }
        .header-left { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .header-right { display: flex; gap: 10px; white-space: nowrap; }
        .company-logo { height: 52px; width: auto; object-fit: contain; animation: waveFlag 3s ease-in-out infinite alternate; filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15)); }
        @keyframes waveFlag { 0% { transform: translate(0, 0) rotateX(0deg) rotateY(-5deg) skewY(-1deg); } 100% { transform: translate(-1px, 2px) rotateX(-2deg) rotateY(10deg) skewY(1deg); } }
        .refresh-btn { background: var(--accent-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .refresh-btn:hover { background: #1d4ed8; }
        .filter-bar { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #475569; }
        .filter-input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .chart-card h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #475569; display: flex; align-items: center; gap: 8px; }
        .scrollable-chart-box-x { position: relative; height: 300px; width: 100%; overflow-x: auto; overflow-y: hidden; }
        .scrollable-chart-box-y { position: relative; height: 300px; width: 100%; overflow-y: auto; overflow-x: hidden; }
        .chart-inner-canvas { position: absolute; left: 0; top: 0; }
        .table-wrapper { width: 100%; overflow-x: auto; height: 300px; }
        .pivot-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .pivot-table th { background: #edf2f7; color: #4a5568; padding: 10px; font-weight: bold; border: 1px solid var(--border-color); position: sticky; top: 0; }
        .pivot-table td { padding: 10px; border: 1px solid var(--border-color); }
        .pivot-table tr:nth-child(even) { background: #f8fafc; }
        .loading-view { text-align: center; font-size: 18px; padding: 15px; color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>
    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#f8fafc; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="width:320px; background:#ffffff; padding: 30px 24px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); text-align:center; box-sizing: border-box;">
            <h3 style="margin: 0 0 20px 0; font-size: 19px; color: #1e293b; font-weight: bold;">현장 점검 접속 인증</h3>
            <input type="text" id="loginName" placeholder="이름" style="width:100%; height:42px; padding:0 12px; margin-bottom:12px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; outline:none;">
            <input type="text" id="loginPhone" placeholder="전화번호" style="width:100%; height:42px; padding:0 12px; margin-bottom:20px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; outline:none;">
            <button onclick="authenticate()" style="width:100%; height:42px; background:#3b82f6; color:white; border:none; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer;">확인</button>
        </div>
    </div>

    <div id="dashboard-content">
        <div class="header-bar">
            <div class="header-left">
                <h2 id="dashboard-title">시설물 점검 실시간 모니터링 현황판</h2>
            </div>
            <div class="header-right">
                <button class="refresh-btn" onclick="loadDashboardData()"><i class="fa-solid fa-rotate"></i> 현황 동기화</button>
                <button class="refresh-btn" onclick="toggleFullScreen()" style="background: #4b5563;"><i class="fa-solid fa-expand"></i> 전체화면</button>
            </div>
        </div>
        <div class="filter-bar">
            <div class="filter-group">
                <i class="fa-regular fa-calendar-days"></i>
                <input type="date" id="startDate" class="filter-input"> ~ <input type="date" id="endDate" class="filter-input">
            </div>
            <select id="filterInspector" class="filter-input"><option value="all">전체 작업자</option></select>
            <select id="filterFid" class="filter-input"><option value="all">전체 설비(FID)</option></select>
            <button class="refresh-btn" onclick="applyFilters()" style="padding: 7px 15px; font-size: 13px;"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
        </div>
        <div id="loading-indicator" class="loading-view" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> 분석 중...</div>
        <div class="dashboard-grid">
            <div class="chart-card">
                <h3>설비ID별 점검자</h3>
                <div class="scrollable-chart-box-x" id="box-stacked"><canvas id="stackedBarChart" class="chart-inner-canvas"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>설비ID별 Count</h3>
                <div class="scrollable-chart-box-y"><canvas id="horizontalBarChart" class="chart-inner-canvas"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>통합점검기록 피봇 테이블</h3>
                <div class="table-wrapper"><table class="pivot-table"><thead><tr><th>설비ID</th><th>점검 총 건수</th></tr></thead><tbody id="pivot-body"></tbody></table></div>
            </div>
            <div class="chart-card">
                <h3>점검자별 설비ID 비율</h3>
                <div style="display:flex; justify-content:center;"><canvas id="pieChart" style="max-width: 280px; height: 300px;"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = "https://script.google.com/macros/s/AKfycbyKVil4NdXVPimQjQEFhUXouiQQkACZuXyjZRNimI5gwCDjPwTMLNf7QurylXwT8nZK/exec";
        const AUTH_URL = "https://script.google.com/macros/s/AKfycbwadQZXfGpQHMcMFRYp30-HuaTjkVsQ1goxnuaSXj-MgGzktUz0eoIhK7815T-y8mQF/exec";
        
        // [수정사항 1] 설비 이름 매핑 사전
        const PIVOT_NAME_MAP = { "전기_01": "전기_01 (전기PC)", "전기_02": "전기_02 (전기 모니터링)" };
        
        let chartInstances = {}, allRecords = [];

        // [수정사항 2] 페이지 로드 시 이번 달 1일~오늘로 날짜 자동 세팅
        window.onload = () => {
            const now = new Date();
            document.getElementById('startDate').value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            document.getElementById('endDate').value = now.toISOString().split('T')[0];
        };

        async function authenticate() {
            const name = document.getElementById('loginName').value;
            const phone = document.getElementById('loginPhone').value;
            const res = await (await fetch(`${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`)).json();
            if (res.status === "SUCCESS") {
                document.getElementById('dashboard-title').innerText = `[${res.center}] 현황판`;
                document.getElementById('login-overlay').style.display = 'none';
                loadDashboardData();
            } else alert("로그인 실패");
        }

        function loadDashboardData() {
            document.getElementById('loading-indicator').style.display = "block";
            fetch(DATA_URL).then(r => r.json()).then(res => {
                document.getElementById('loading-indicator').style.display = "none";
                allRecords = res.records;
                setFilterOptions(allRecords);
                applyFilters();
            });
        }

        function setFilterOptions(recs) {
            const ins = [...new Set(recs.map(r => r.inspector))].sort();
            const fids = [...new Set(recs.map(r => r.fid))].sort();
            document.getElementById('filterInspector').innerHTML = '<option value="all">전체 작업자</option>' + ins.map(i => `<option value="${i}">${i}</option>`).join('');
            document.getElementById('filterFid').innerHTML = '<option value="all">전체 설비(FID)</option>' + fids.map(f => `<option value="${f}">${f}</option>`).join('');
        }

        function applyFilters() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const filtered = allRecords.filter(r => (r.date >= start && r.date <= end));
            buildDashboard(filtered);
        }

        function buildDashboard(records) {
            Object.keys(chartInstances).forEach(k => chartInstances[k]?.destroy());
            let fids = [...new Set(records.map(r => r.fid))].sort();
            
            // [수정사항 3] 스크롤 유지를 위한 강제 너비 확보
            document.getElementById('stackedBarChart').parentElement.style.minWidth = (fids.length * 60) + "px";

            chartInstances.stackedBarChart = new Chart(document.getElementById('stackedBarChart'), {
                type: 'bar',
                data: { labels: fids, datasets: [{ label: '점검', data: fids.map(f => records.filter(r => r.fid === f).length), backgroundColor: ['#f59e0b', '#6366f1'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // [수정사항 4] 피벗 테이블 매핑 적용
            document.getElementById('pivot-body').innerHTML = fids.map(f => 
                `<tr><td style="font-weight:bold;">${PIVOT_NAME_MAP[f] || f}</td><td>${records.filter(r => r.fid === f).length} 건</td></tr>`
            ).join('');

            chartInstances.pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: { labels: [...new Set(records.map(r => r.inspector))], datasets: [{ data: [...new Set(records.map(r => r.inspector))].map(i => records.filter(r => r.inspector === i).length), backgroundColor: ['#3b82f6', '#f97316'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function toggleFullScreen() { !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); }
    </script>
</body>
</html>
