<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시설물 점검 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-color: #e2e8f0;
            --accent-blue: #3b82f6;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Malgun Gothic', dotum, sans-serif; background: var(--bg-dark); color: var(--text-main);
        }
        
        /* 헤더 바 레이아웃 구조 */
        .header-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 10px; 
            border-bottom: 2px solid var(--border-color);
            flex-wrap: nowrap; /* 줄 바꿈 방지 */
        }
        .header-left {
            display: flex; 
            align-items: center; 
            gap: 15px;
            flex-shrink: 0; /* 제목 영역이 찌그러지지 않게 설정 */
        }
        .header-right {
            display: flex; 
            gap: 10px; 
            white-space: nowrap; /* 버튼들이 한 줄로 유지되게 */
        }
        
        /* 💡 [수정] 로고 전체가 깃발처럼 입체적으로 자연스럽게 펄럭이도록 고정축 및 효과 변경 */
        .company-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
            transform-origin: center center; /* 중심축을 정중앙으로 이동 */
            animation: waveFlag 3s ease-in-out infinite alternate;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
        }
        
        @keyframes waveFlag {
            0% { 
                transform: translate(0, 0) rotateX(0deg) rotateY(-5deg) skewY(-1deg); 
            }
            5% {
                transform: translate(1px, -1px) rotateX(2deg) rotateY(5deg) skewY(1deg);
            }
            100% { 
                transform: translate(-1px, 2px) rotateX(-2deg) rotateY(10deg) skewY(1deg); 
            }
        }
        
        .header-bar h2 { margin: 0; font-size: 24px; color: #1e293b; }
        .refresh-btn {
            background: var(--accent-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .refresh-btn:hover { background: #1d4ed8; }
        
        /* 기간/조건 설정 필터바 스타일 */
        .filter-bar {
            background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #475569; }
        .filter-input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }

        /* 2x2 격자 레이아웃 배치 구조 */
        .dashboard-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        .chart-card {
            background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
        }
        .chart-card h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #475569; display: flex; align-items: center; gap: 8px; }
        
        /* 박스 자체 크기는 고정하고 넘치는 부분만 스크롤바 생성 */
        .scrollable-chart-box-x { position: relative; height: 300px; width: 100%; overflow-x: auto; overflow-y: hidden; }
        .scrollable-chart-box-y { position: relative; height: 300px; width: 100%; overflow-y: auto; overflow-x: hidden; }
        .chart-inner-canvas { position: absolute; left: 0; top: 0; }
        
        /* 피봇 테이블 커스텀 스타일 정의 */
        .table-wrapper { width: 100%; overflow-x: auto; height: 300px; }
        .pivot-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .pivot-table th { background: #edf2f7; color: #4a5568; padding: 10px; font-weight: bold; border: 1px solid var(--border-color); position: sticky; top: 0; }
        .pivot-table td { padding: 10px; border: 1px solid var(--border-color); }
        .pivot-table tr:nth-child(even) { background: #f8fafc; }
        .loading-view { text-align: center; font-size: 18px; padding: 5px; color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="width:300px; text-align:center;">
            <h3>현장 점검 접속 인증</h3>
            <input type="text" id="loginName" placeholder="이름" style="width:100%; padding:10px; margin-bottom:10px;"><br>
            <input type="text" id="loginPhone" placeholder="전화번호" style="width:100%; padding:10px; margin-bottom:10px;"><br>
            <button onclick="authenticate()" style="width:100%; padding:10px; background:#3b82f6; color:white; border:none; cursor:pointer;">확인</button>
        </div>
    </div>

    <div class="header-bar">
        <div class="header-left">
            <img src="assets/logo.jpg" alt="Company Logo" class="company-logo" onerror="this.style.display='none';">
            <h2 id="dashboard-title">시설물 점검 실시간 모니터링 현황판</h2>
        </div>
        
        <div class="header-right">
            <button class="refresh-btn" onclick="loadDashboardData()">
                <i class="fa-solid fa-rotate"></i> 현황 동기화
            </button>
            <button class="refresh-btn" onclick="toggleFullScreen()" style="background: #4b5563;">
                <i class="fa-solid fa-expand"></i> 전체화면
            </button>  
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <i class="fa-regular fa-calendar-days"></i>
            <input type="date" id="startDate" class="filter-input"> ~ <input type="date" id="endDate" class="filter-input">
        </div>
        <span>|</span>
        <div class="filter-group">
            <label for="filterInspector">작업자: </label>
            <select id="filterInspector" class="filter-input">
                <option value="all">전체 작업자</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterFid">설비ID: </label>
            <select id="filterFid" class="filter-input">
                <option value="all">전체 설비(FID)</option>
            </select>
        </div>
        <button class="refresh-btn" onclick="applyFilters()" style="padding: 7px 15px; font-size: 13px;"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
    </div>

    <div id="loading-indicator" class="loading-view" style="display:none;">
        <i class="fa-solid fa-spinner fa-spin"></i> 구글 시트 원본 데이터 분석 및 가공 중...
    </div>

    <div class="dashboard-grid" id="dashboard-content">
        <div class="chart-card">
            <h3><i class="fa-solid fa-chart-bar"></i> 설비ID 및 날짜별 점검자</h3>
            <div class="scrollable-chart-box-x" id="box-stacked">
                <canvas id="stackedBarChart" class="chart-inner-canvas"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h3><i class="fa-solid fa-align-left"></i> 설비ID 및 날짜별 Record Count</h3>
            <div class="scrollable-chart-box-y" id="box-horizontal">
                <canvas id="horizontalBarChart" class="chart-inner-canvas"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h3><i class="fa-solid fa-table"></i> 통합점검기록 피봇 테이블</h3>
            <div class="table-wrapper">
                <table class="pivot-table">
                    <thead>
                        <tr id="pivot-header">
                            <th>설비ID</th>
                            <th>점검 총 건수</th>
                        </tr>
                    </thead>
                    <tbody id="pivot-body"></tbody>
                </table>
            </div>
        </div>

        <div class="chart-card">
            <h3><i class="fa-solid fa-chart-pie"></i> 점검자별 설비ID 비율</h3>
            <div class="chart-container" style="display: flex; justify-content: center;">
                <canvas id="pieChart" style="max-width: 280px; height: 300px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        const DATA_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKVil4NdXVPimQjQEFhUXouiQQkACZuXyjZRNimI5gwCDjPwTMLNf7QurylXwT8nZK/exec";
        
        let chartInstances = {};
        let allRecords = []; 
        let userCenter = "";
        
        window.onload = function() {
            loadDashboardData();
        };

        const AUTH_URL = "https://script.google.com/macros/s/AKfycbwadQZXfGpQHMcMFRYp30-HuaTjkVsQ1goxnuaSXj-MgGzktUz0eoIhK7815T-y8mQF/exec"; 
                
        async function authenticate() {
            const name = document.getElementById('loginName').value;
            const phone = document.getElementById('loginPhone').value;
        
            const url = `${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&t=${Date.now()}`;
        
            try {
                const response = await fetch(url, { 
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store'
                });
        
                const res = await response.json();
        
                if (res.status === "SUCCESS") {
                    alert("로그인 성공! (" + res.center + " 소속)");
                    userCenter = res.center;
                    document.getElementById('dashboard-title').innerText = `[${res.center}] 시설물 점검 실시간 모니터링 현황판`;
                    document.getElementById('login-overlay').style.display = 'none';
                    loadDashboardData();
                } else {
                    alert("로그인 실패");
                }
        
            } catch (error) {
                console.error("로그인 통신 오류:", error); 
                alert("서버 통신 오류");
            }
        }
            
        let lastKnownTime = 0; 

        function loadDashboardData() {
            document.getElementById('loading-indicator').style.display = "block";
        
            fetch(DATA_WEB_APP_URL, { 
                mode: 'cors',
                cache: 'no-store'
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-indicator').style.display = "none";
        
                if(res.status === "success") {
                    allRecords = res.records;
                    setFilterOptions(allRecords);
                    applyFilters();
                    
                    if(res.lastUpdate) {
                        lastKnownTime = res.lastUpdate;
                    }
                } else {
                    alert("데이터 실패: " + res.message);
                }
            })
            .catch(err => {
                document.getElementById('loading-indicator').style.display = "none";
                console.error("데이터 통신 오류:", err); 
                alert("네트워크 오류");
            });
        }
        
        async function syncDashboard() {
          try {
            const res = await fetch(DATA_WEB_APP_URL, { cache: 'no-store' }); 
            const json = await res.json();
            
            if (json.lastUpdate !== lastKnownTime) {
              console.log("시트 변경 감지! 도장이 바뀌었으니 데이터를 새로 가져옵니다.");
              loadDashboardData(); 
            } else {
              console.log("시트 변동 없음. 대기 중...");
            }
          } catch (err) {
            console.error("자동 동기화 체크 중 오류:", err);
          }
        }
        
        setInterval(syncDashboard, 60000);
        
        function setFilterOptions(records) {
            if (!records || records.length === 0) {
                console.warn("데이터가 아직 로드되지 않았습니다.");
                return; 
            }
            
            let inspectors = [...new Set(records.map(r => r.inspector))].filter(Boolean).sort();
            let fids = [...new Set(records.map(r => r.fid))].filter(Boolean).sort();
            
            const insSelect = document.getElementById('filterInspector');
            const fidSelect = document.getElementById('filterFid');
            
            insSelect.innerHTML = '<option value="all">전체 작업자</option>';
            fidSelect.innerHTML = '<option value="all">전체 설비(FID)</option>';
            
            inspectors.forEach(ins => insSelect.innerHTML += `<option value="${ins}">${ins}</option>`);
            fids.forEach(fid => fidSelect.innerHTML += `<option value="${fid}">${fid}</option>`);
        }

        function applyFilters() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const selectedInspector = document.getElementById('filterInspector').value;
            const selectedFid = document.getElementById('filterFid').value;

            let filtered = allRecords.filter(r => {
                let rDate = r.date || r["날짜"];
                
                const dateMatch = (!start || rDate >= start) && (!end || rDate <= end);
                const inspectorMatch = (selectedInspector === "all" || r.inspector === selectedInspector);
                const fidMatch = (selectedFid === "all" || r.fid === selectedFid);
                
                return dateMatch && inspectorMatch && fidMatch;
            });

            buildDashboard(filtered);
        }

         function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`전체화면 모드를 지원하지 않는 브라우저입니다: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        
        document.addEventListener("fullscreenchange", () => {
            const fsBtn = document.querySelector('[onclick="toggleFullScreen()"]');
            if (document.fullscreenElement) {
                fsBtn.innerHTML = '<i class="fa-solid fa-compress"></i> 전체화면 종료';
            } else {
                fsBtn.innerHTML = '<i class="fa-solid fa-expand"></i> 전체화면';
            }
        });

        // =========================================================================
        // 데이터 가동 및 유동적 스크롤 차트 빌더 (★애니메이션 액션 부활 버전)
        // =========================================================================
        function buildDashboard(records) {
            // 💡 [수정] 동기화 시 무조건 막대가 다시 생겨나는 액션을 위해 기존 차트를 완전히 파괴하고 캔버스를 초기화
            Object.keys(chartInstances).forEach(key => {
                if(chartInstances[key]) {
                    chartInstances[key].destroy();
                    chartInstances[key] = null; // 인스턴스 확실히 비우기
                }
            });

            let fids = [...new Set(records.map(r => r.fid))].sort();
            let inspectors = [...new Set(records.map(r => r.inspector))];
            
            const fidCount = fids.length;

            // -------------------------------------------------------------------------
            // 1. 세로 막대형 스크롤 조절 및 애니메이션 추가
            // -------------------------------------------------------------------------
            const stackedCanvas = document.getElementById('stackedBarChart');
            
            if (fidCount > 10) {
                let dynamicWidth = fidCount * 55;
                stackedCanvas.style.width = dynamicWidth + "px";
                stackedCanvas.style.height = "280px"; 
            } else {
                stackedCanvas.style.width = "100%";
                stackedCanvas.style.height = "100%";
            }

            let inspectorCountsByFid = {};
            fids.forEach(fid => { inspectorCountsByFid[fid] = records.filter(r => r.fid === fid).length; });
            
            chartInstances.stackedBarChart = new Chart(stackedCanvas, {
                type: 'bar',
                data: {
                    labels: fids,
                    datasets: [{
                        label: '점검 누적 카운트',
                        data: fids.map(fid => inspectorCountsByFid[fid]),
                        backgroundColor: ['#f59e0b', '#6366f1', '#06b6d4', '#10b981', '#ec4899', '#3b82f6'],
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    // 💡 [추가] 차트가 그려질 때 1초(1000ms) 동안 아래에서 위로 스무스하게 올라오는 애니메이션 강제 지정
                    animation: {
                        duration: 1000,
                        easing: 'easeOutQuart'
                    },
                    scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } } 
                }
            });

            // -------------------------------------------------------------------------
            // 2. 가로 막대형 스크롤 조절 및 애니메이션 추가
            // -------------------------------------------------------------------------
            const horizontalCanvas = document.getElementById('horizontalBarChart');
            
            if (fidCount > 10) {
                let dynamicHeight = fidCount * 30;
                horizontalCanvas.style.height = dynamicHeight + "px";
                horizontalCanvas.style.width = "100%";
            } else {
                horizontalCanvas.style.height = "100%";
                horizontalCanvas.style.width = "100%";
            }

            chartInstances.horizontalBarChart = new Chart(horizontalCanvas, {
                type: 'bar',
                data: {
                    labels: fids,
                    datasets: [{
                        label: '설비별 Record Count',
                        data: fids.map(fid => records.filter(r => r.fid === fid).length),
                        backgroundColor: '#3b82f6',
                        barThickness: 18
                    }]
                },
                options: { 
                    indexAxis: 'y', 
                    responsive: true, 
                    maintainAspectRatio: false,
                    // 💡 [추가] 가로 막대도 왼쪽에서 오른쪽으로 슥 밀려 나오는 액션 적용
                    animation: {
                        duration: 1000,
                        easing: 'easeOutQuart'
                    },
                    scales: { x: { beginAtZero: true } } 
                }
            });

            // -------------------------------------------------------------------------
            // 3. 피봇 테이블
            // ------------------------------------------------------------------------
            const pivotBody = document.getElementById('pivot-body');
            let tableHtml = "";
            fids.forEach(fid => {
                let totalCount = records.filter(r => r.fid === fid).length;
                tableHtml += `<tr>
                    <td style="font-weight:bold; color:#1e293b;">${fid}</td>
                    <td>${totalCount} 건</td>
                </tr>`;
            });
            pivotBody.innerHTML = tableHtml;

            // -------------------------------------------------------------------------
            // 4. 원형 차트 (💡 마우스를 대지 않아도 이름과 %가 조각 위에 상시 고정 표시됨)
            // -------------------------------------------------------------------------
            let inspectorData = inspectors.map(ins => records.filter(r => r.inspector === ins).length);
            let total = inspectorData.reduce((a, b) => a + b, 0); 
            
            chartInstances.pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: {
                    labels: inspectors,
                    datasets: [{
                        data: inspectorData,
                        backgroundColor: ['#3b82f6', '#f97316', '#a855f7', '#84cc16', '#06b6d4', '#eab308']
                    }]
                },
                plugins: [ChartDataLabels], // 데이터 라벨 플러그인 주입
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: {
                            color: '#ffffff', // 라벨 글자 색상
                            font: {
                                weight: 'bold',
                                size: 12
                            },
                            formatter: function(value, context) {
                                let percentage = ((value / total) * 100).toFixed(1);
                                if (percentage < 3) return ''; // 3% 미만 미미한 조각은 글자 숨겨서 겹침 방지
                                
                                // 차트 위에 [이름: 00%] 형태로 줄바꿈 표시
                                return context.chart.data.labels[context.dataIndex] + '\n' + percentage + '%';
                            },
                            align: 'center',
                            anchor: 'center',
                            textAlign: 'center'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw;
                                    let percentage = ((value / total) * 100).toFixed(1); 
                                    return `${context.label}: ${value}건 (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
