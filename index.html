<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시설물 점검 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-color: #e2e8f0;
            --accent-blue: #3b82f6;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Malgun Gothic', dotum, sans-serif; background: var(--bg-dark); color: var(--text-main);
        }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); flex-wrap: nowrap;
        }
        .header-left { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .header-right { display: flex; gap: 10px; white-space: nowrap; }
        
        .company-logo {
            height: 52px; width: auto; object-fit: contain; transform-origin: center center;
            animation: waveFlag 3s ease-in-out infinite alternate;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
        }
        
        @keyframes waveFlag {
            0% { transform: translate(0, 0) rotateX(0deg) rotateY(-5deg) skewY(-1deg); }
            5% { transform: translate(1px, -1px) rotateX(2deg) rotateY(5deg) skewY(1deg); }
            100% { transform: translate(-1px, 2px) rotateX(-2deg) rotateY(10deg) skewY(1deg); }
        }
        
        .header-bar h2 { margin: 0; font-size: 24px; color: #1e293b; }
        .refresh-btn {
            background: var(--accent-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .refresh-btn:hover { background: #1d4ed8; }
        
        .filter-bar {
            background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #475569; }
        .filter-input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .chart-card h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #475569; display: flex; align-items: center; gap: 8px; }
        
        .scrollable-chart-box-x { position: relative; height: 300px; width: 100%; overflow-x: auto; overflow-y: hidden; }
        .scrollable-chart-box-y { position: relative; height: 300px; width: 100%; overflow-y: auto; overflow-x: hidden; }
        .chart-inner-canvas { position: absolute; left: 0; top: 0; }
        
        .table-wrapper { width: 100%; overflow-x: auto; height: 300px; }
        .pivot-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .pivot-table th { background: #edf2f7; color: #4a5568; padding: 10px; font-weight: bold; border: 1px solid var(--border-color); position: sticky; top: 0; }
        .pivot-table td { padding: 10px; border: 1px solid var(--border-color); }
        .pivot-table tr:nth-child(even) { background: #f8fafc; }
        .loading-view { text-align: center; font-size: 18px; padding: 15px; color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#f8fafc; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="width:320px; background:#ffffff; padding: 30px 24px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); text-align:center; box-sizing: border-box;">
            <div style="margin-bottom: 20px; display: flex; justify-content: center; align-items: center;">
                <img src="assets/logo.jpg" alt="Company Logo" style="height: 48px; width: auto; object-fit: contain; filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.08));" onerror="this.style.display='none';">
            </div>
            <h3 style="margin: 0 0 20px 0; font-size: 19px; color: #1e293b; font-weight: bold;">현장 점검 접속 인증</h3>
            <input type="text" id="loginName" placeholder="이름" style="width:100%; height:42px; padding:0 12px; margin-bottom:12px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; outline:none;">
            <br>
            <input type="text" id="loginPhone" placeholder="전화번호" style="width:100%; height:42px; padding:0 12px; margin-bottom:20px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; outline:none;">
            <br>
            <button onclick="authenticate()" style="width:100%; height:42px; background:#3b82f6; color:white; border:none; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; box-sizing:border-box;">확인</button>
        </div>
    </div>

    <div id="dashboard-content">
        <div class="header-bar">
            <div class="header-left">
                <img src="assets/logo.jpg" alt="Company Logo" class="company-logo" onerror="this.style.display='none';">
                <h2 id="dashboard-title">시설물 점검 실시간 모니터링 현황판</h2>
            </div>
            <div class="header-right">
                <button class="refresh-btn" onclick="loadDashboardData()">
                    <i class="fa-solid fa-rotate"></i> 현황 동기화
                </button>
                <button class="refresh-btn" onclick="toggleFullScreen()" style="background: #4b5563;">
                    <i class="fa-solid fa-expand"></i> 전체화면
                </button>  
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-group">
                <i class="fa-regular fa-calendar-days"></i>
                <input type="date" id="startDate" class="filter-input"> ~ <input type="date" id="endDate" class="filter-input">
            </div>
            <span>|</span>
            <div class="filter-group">
                <label for="filterInspector">작업자: </label>
                <select id="filterInspector" class="filter-input">
                    <option value="all">전체 작업자</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterFid">설비ID: </label>
                <select id="filterFid" class="filter-input">
                    <option value="all">전체 설비(FID)</option>
                </select>
            </div>
            <button class="refresh-btn" onclick="applyFilters()" style="padding: 7px 15px; font-size: 13px;"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
        </div>

        <div id="loading-indicator" class="loading-view" style="display:none;">
            <i class="fa-solid fa-spinner fa-spin"></i> 구글 시트 원본 데이터 분석 및 가공 중...
        </div>

        <div class="dashboard-grid">
            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-bar"></i> 설비ID 및 날짜별 점검자</h3>
                <div class="scrollable-chart-box-x" id="box-stacked">
                    <canvas id="stackedBarChart" class="chart-inner-canvas"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fa-solid fa-align-left"></i> 설비ID 및 날짜별 Record Count</h3>
                <div class="scrollable-chart-box-y" id="box-horizontal">
                    <canvas id="horizontalBarChart" class="chart-inner-canvas"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fa-solid fa-table"></i> 통합점검기록 피봇 테이블</h3>
                <div class="table-wrapper">
                    <table class="pivot-table">
                        <thead>
                            <tr id="pivot-header">
                                <th>설비ID</th>
                                <th>점검 총 건수</th>
                            </tr>
                        </thead>
                        <tbody id="pivot-body"></tbody>
                    </table>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-pie"></i> 점검자별 설비ID 비율</h3>
                <div class="chart-container" style="display: flex; justify-content: center;">
                    <canvas id="pieChart" style="max-width: 280px; height: 300px;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DATA_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKVil4NdXVPimQjQEFhUXouiQQkACZuXyjZRNimI5gwCDjPwTMLNf7QurylXwT8nZK/exec";
        const AUTH_URL = "https://script.google.com/macros/s/AKfycbwadQZXfGpQHMcMFRYp30-HuaTjkVsQ1goxnuaSXj-MgGzktUz0eoIhK7815T-y8mQF/exec"; 
        
        let chartInstances = {};
        let allRecords = []; 
        let userCenter = "";
        let lastKnownTime = 0; 
        
        window.onload = function() { };
        
        async function authenticate() {
            const name = document.getElementById('loginName').value;
            const phone = document.getElementById('loginPhone').value;
            const url = `${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&t=${Date.now()}`;
        
            try {
                const response = await fetch(url);
                const res = await response.json();
                if (res.status === "SUCCESS") {
                    userCenter = res.center;
                    document.getElementById('dashboard-title').innerText = `[${res.center}] 시설물 점검 실시간 모니터링 현황판`;
                    document.getElementById('login-overlay').style.display = 'none';
                    loadDashboardData(); 
                } else {
                    alert("로그인 실패");
                }
            } catch (error) {
                alert("서버 통신 오류");
            }
        }
        
        function loadDashboardData() {
            document.getElementById('loading-indicator').style.display = "block";
        
            // ✅ 그래프 리셋 효과
            Object.values(chartInstances).forEach(c => {
                if (c) c.destroy();
            });
            chartInstances = {};
        
            fetch(DATA_WEB_APP_URL)
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-indicator').style.display = "none";
                if(res.status === "success") {
                    allRecords = res.records;
                    setFilterOptions(allRecords);
                    applyFilters();
                    if(res.lastUpdate) lastKnownTime = res.lastUpdate;
                }
            })
            .catch(() => {
                document.getElementById('loading-indicator').style.display = "none";
                alert("네트워크 오류");
            });
        }
        
        async function syncDashboard() {
            try {
                const res = await fetch(DATA_WEB_APP_URL);
                const json = await res.json();
                if (json.lastUpdate !== lastKnownTime) {
                    loadDashboardData(); 
                }
            } catch {}
        }
        setInterval(syncDashboard, 60000);
        
        function setFilterOptions(records) {
            let inspectors = [...new Set(records.map(r => r.inspector))].filter(Boolean);
            let fids = [...new Set(records.map(r => r.fid))].filter(Boolean);
        
            const ins = document.getElementById('filterInspector');
            const fid = document.getElementById('filterFid');
        
            ins.innerHTML = '<option value="all">전체 작업자</option>';
            fid.innerHTML = '<option value="all">전체 설비(FID)</option>';
        
            inspectors.forEach(i => ins.innerHTML += `<option value="${i}">${i}</option>`);
            fids.forEach(f => fid.innerHTML += `<option value="${f}">${f}</option>`);
        }
        
        function applyFilters() {
            const selectedFid = document.getElementById('filterFid').value;
        
            let filtered = allRecords.filter(r => {
                return selectedFid === "all" || r.fid === selectedFid;
            });
        
            buildDashboard(filtered);
        }
        
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        
        function buildDashboard(records) {
        
            let fids = [...new Set(records.map(r => r.fid))];
            let inspectors = [...new Set(records.map(r => r.inspector))];
        
            // ✅ 1번 차트
            const stackedCanvas = document.getElementById('stackedBarChart');
        
            chartInstances.stackedBarChart = new Chart(stackedCanvas, {
                type: 'bar',
                data: {
                    labels: fids,
                    datasets: [{
                        data: fids.map(fid => records.filter(r => r.fid === fid).length),
                        backgroundColor: '#6366f1'
                    }]
                },
                options: {
                    animation: { duration: 800 }
                }
            });
        
            // ✅ 2번 차트 (그라데이션 색상)
            const ctx = document.getElementById('horizontalBarChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0,0,400,0);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#06b6d4');
        
            chartInstances.horizontalBarChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: fids,
                    datasets: [{
                        data: fids.map(fid => records.filter(r => r.fid === fid).length),
                        backgroundColor: gradient
                    }]
                },
                options: {
                    indexAxis: 'y',
                    animation: { duration: 800 }
                }
            });
        
            // ✅ 3번 피봇 (선택된 설비만 반영)
            const pivotBody = document.getElementById('pivot-body');
            pivotBody.innerHTML = "";
        
            fids.forEach(fid => {
                let count = records.filter(r => r.fid === fid).length;
                pivotBody.innerHTML += `<tr><td>${fid}</td><td>${count}</td></tr>`;
            });
        
            // 4번 그대로 유지
            const pieCanvas = document.getElementById('pieChart');
        
            chartInstances.pieChart = new Chart(pieCanvas, {
                type: 'pie',
                data: {
                    labels: inspectors,
                    datasets: [{
                        data: inspectors.map(i => records.filter(r => r.inspector === i).length)
                    }]
                }
            });
        }
    </script>
</body>
</html>
