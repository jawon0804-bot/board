<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설물 점검 모니터링 대시보드</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>
body { margin:0; padding:20px; font-family:Arial; background:#f4f6f9; }
.header-bar { display:flex; justify-content:space-between; margin-bottom:10px; }
button { padding:8px 12px; cursor:pointer; }
.dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chart-card { background:#fff; padding:10px; border-radius:10px; }
</style>
</head>

<body>

<div id="login-overlay">
  <input id="loginName" placeholder="이름">
  <input id="loginPhone" placeholder="전화번호">
  <button onclick="authenticate()">로그인</button>
</div>

<div id="dashboard-content">

<div class="header-bar">
  <h2 id="dashboard-title">대시보드</h2>

  <div>
    <!-- ✅ 수정됨 -->
    <button onclick="syncWithEffect()">동기화</button>
    <button onclick="toggleFullScreen()">전체화면</button>
  </div>
</div>

<div id="loading-indicator" style="display:none;">로딩중...</div>

<div class="dashboard-grid">
  <div class="chart-card"><canvas id="stackedBarChart"></canvas></div>
  <div class="chart-card"><canvas id="horizontalBarChart"></canvas></div>
  <div class="chart-card"><canvas id="pieChart"></canvas></div>
</div>

</div>

<script>
const DATA_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKVil4NdXVPimQjQEFhUXouiQQkACZuXyjZRNimI5gwCDjPwTMLNf7QurylXwT8nZK/exec";
const AUTH_URL = "https://script.google.com/macros/s/AKfycbwadQZXfGpQHMcMFRYp30-HuaTjkVsQ1goxnuaSXj-MgGzktUz0eoIhK7815T-y8mQF/exec";

let chartInstances = {};
let allRecords = [];
let lastKnownTime = 0;

/* ================= 로그인 ================= */
async function authenticate() {
  const name = document.getElementById('loginName').value;
  const phone = document.getElementById('loginPhone').value;

  try {
    const res = await fetch(`${AUTH_URL}?name=${name}&phone=${phone}`);
    const json = await res.json();

    if(json.status === "SUCCESS") {
      document.getElementById('login-overlay').style.display="none";
      loadDashboardData();
    } else {
      alert("로그인 실패");
    }
  } catch(e){
    alert("통신 오류");
  }
}

/* ================= 데이터 로드 ================= */
function loadDashboardData() {
  document.getElementById('loading-indicator').style.display="block";

  fetch(DATA_WEB_APP_URL, {cache:'no-store'})
  .then(res=>res.json())
  .then(res=>{
    document.getElementById('loading-indicator').style.display="none";

    console.log("📡 서버응답:", res);

    // ✅ 핵심 수정
    const records = res.records || res.data || res.result || [];

    if(records.length === 0){
      alert("데이터 없음");
      return;
    }

    allRecords = records;

    // 전체 차트 제거
    Object.keys(chartInstances).forEach(k=>{
      if(chartInstances[k]){
        chartInstances[k].destroy();
        chartInstances[k]=null;
      }
    });

    setTimeout(()=>{
      buildDashboard(allRecords);
    },200);

    if(res.lastUpdate) lastKnownTime = res.lastUpdate;
  })
  .catch(err=>{
    document.getElementById('loading-indicator').style.display="none";
    console.error(err);
    alert("통신 오류");
  });
}

/* ================= 동기화 ================= */
function syncWithEffect() {

  // ✅ 1,2번만 초기화
  if(chartInstances.stackedBarChart){
    chartInstances.stackedBarChart.destroy();
    chartInstances.stackedBarChart=null;
  }
  if(chartInstances.horizontalBarChart){
    chartInstances.horizontalBarChart.destroy();
    chartInstances.horizontalBarChart=null;
  }

  setTimeout(()=>{
    loadDashboardData();
  },200);
}

/* ================= 자동 동기화 ================= */
setInterval(async ()=>{
  try{
    const res = await fetch(DATA_WEB_APP_URL);
    const json = await res.json();

    if(json.lastUpdate !== lastKnownTime){
      syncWithEffect();
    }
  }catch(e){}
},60000);

/* ================= 그래프 ================= */
function buildDashboard(records){

  const fids = [...new Set(records.map(r=>r.fid))];

  // 1번
  chartInstances.stackedBarChart = new Chart(
    document.getElementById('stackedBarChart'),
    {
      type:'bar',
      data:{
        labels:fids,
        datasets:[{
          data:fids.map(fid=>records.filter(r=>r.fid===fid).length)
        }]
      },
      options:{animation:{duration:800}}
    }
  );

  // 2번
  chartInstances.horizontalBarChart = new Chart(
    document.getElementById('horizontalBarChart'),
    {
      type:'bar',
      data:{
        labels:fids,
        datasets:[{
          data:fids.map(fid=>records.filter(r=>r.fid===fid).length)
        }]
      },
      options:{indexAxis:'y'}
    }
  );

  // 4번 (유지)
  if(!chartInstances.pieChart){
    const inspectors = [...new Set(records.map(r=>r.inspector))];

    chartInstances.pieChart = new Chart(
      document.getElementById('pieChart'),
      {
        type:'pie',
        data:{
          labels:inspectors,
          datasets:[{
            data:inspectors.map(i=>records.filter(r=>r.inspector===i).length)
          }]
        }
      }
    );
  }
}

/* ================= 전체화면 ================= */
function toggleFullScreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}
</script>

</body>
</html>
