<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시설물 점검 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        :root {
            --bg-dark: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-color: #e2e8f0;
            --accent-blue: #3b82f6;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Malgun Gothic', dotum, sans-serif; background: var(--bg-dark); color: var(--text-main);
        }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-right { display: flex; gap: 10px; white-space: nowrap; }
        
        .company-logo {
            height: 52px; width: auto; object-fit: contain; transform-origin: center center;
            animation: waveFlag 3s ease-in-out infinite alternate;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
        }
        
        @keyframes waveFlag {
            0% { transform: translate(0, 0) rotateX(0deg) rotateY(-5deg) skewY(-1deg); }
            5% { transform: translate(1px, -1px) rotateX(2deg) rotateY(5deg) skewY(1deg); }
            100% { transform: translate(-1px, 2px) rotateX(-2deg) rotateY(10deg) skewY(1deg); }
        }

        /* 전체 화면 로딩창 껍데기 */
        .fullscreen-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.5); /* 반투명 화이트 배경 */
            backdrop-filter: blur(0.5px); /* 뒷화면 고급스러운 블러 처리 */
            /* 🔴 뒷배경이 너무 뭉개지지 않고 은은하게 유리가 낀 것처럼 보이도록 블러를 2.5px로 조절했습니다. */
            -webkit-backdrop-filter: blur(0.5px); /* 사파리/아이폰 브라우저 호환용 */
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; /* 로그인창보다 무조건 위에 뜨도록 설정 */
        }
        .loader-box { text-align: center; }

        /* 외부 아이콘 없이 브라우저 자체 힘으로 돌리는 현대식 링 스피너 */
        .spinner-circle {
            width: 50px; height: 50px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid #3b82f6; /* Maxerve 대시보드와 잘 어울리는 파란색 */
            border-radius: 50%;
            animation: loader-spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        .loader-text { font-size: 16px; font-weight: bold; color: #1e293b; margin: 0; }

        @keyframes loader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header-bar h2 { margin: 0; font-size: 24px; color: #1e293b; }
        .refresh-btn {
            background: var(--accent-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .refresh-btn:hover { background: #1d4ed8; }
        
        .filter-bar {
            background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #475569; }
        .filter-input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); box-sizing: border-box; }
        .chart-card h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #475569; display: flex; align-items: center; gap: 8px; }
        
        .scrollable-chart-box-x { position: relative; height: 300px; width: 100%; overflow-x: auto; overflow-y: hidden; }
        .scrollable-chart-box-y { position: relative; height: 300px; width: 100%; overflow-y: auto !important; overflow-x: hidden !important; }
        
        .table-wrapper { width: 100%; overflow-x: auto; height: 300px; }
        .pivot-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .pivot-table th { background: #edf2f7; color: #4a5568; padding: 10px; font-weight: bold; border: 1px solid var(--border-color); position: sticky; top: 0; }
        .pivot-table td { padding: 10px; border: 1px solid var(--border-color); }
        .pivot-table tr:nth-child(even) { background: #f8fafc; }
        
        .loading-view { text-align: center; font-size: 18px; padding: 15px; color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#f8fafc; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div style="width:320px; background:#ffffff; padding: 30px 24px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); text-align:center; box-sizing: border-box;">
            <div style="margin-bottom: 20px; display: flex; justify-content: center; align-items: center;">
                <img src="assets/logo.jpg" alt="Company Logo" style="height: 48px; width: auto; object-fit: contain;" onerror="this.style.display='none';">
            </div>
            <h3 style="margin: 0 0 20px 0; font-size: 19px; color: #1e293b; font-weight: bold;">현장 점검 접속 인증</h3>
            <input type="text" id="loginName" placeholder="이름" style="width:100%; height:42px; padding:0 12px; margin-bottom:12px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; outline:none;">
            <br>
            <input type="text" id="loginPhone" placeholder="전화번호" style="width:100%; height:42px; padding:0 12px; margin-bottom:20px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; outline:none;">
            <br>
            <button onclick="authenticate()" style="width:100%; height:42px; background:#3b82f6; color:white; border:none; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; box-sizing:border-box;">확인</button>
        </div>
    </div>

    <div id="dashboard-content">
        <div class="header-bar">
            <div class="header-left">
                <img src="assets/logo.jpg" alt="Company Logo" class="company-logo" onerror="this.style.display='none';">
                <h2 id="dashboard-title">시설물 점검 실시간 모니터링 현황판</h2>
            </div>
            <div class="header-right">
                <button class="refresh-btn" onclick="loadDashboardData()">
                    <i class="fa-solid fa-rotate"></i> 현황 동기화
                </button>
                <button class="refresh-btn" onclick="toggleFullScreen()" style="background: #4b5563;">
                    <i class="fa-solid fa-expand"></i> 전체화면
                </button>  
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-group">
                <i class="fa-regular fa-calendar-days"></i>
                <input type="date" id="startDate" class="filter-input"> ~ <input type="date" id="endDate" class="filter-input">
                <button type="button" onclick="resetDateFilter()" class="filter-input" style="margin-left: 5px; cursor: pointer; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0 8px; font-size: 12px; height: 100%;">선택 안함</button>
            </div>
            
            <span>|</span>
            
            <div class="filter-group">
                <label for="filterInspector">작업자: </label>
                <select id="filterInspector" class="filter-input">
                    <option value="all">전체 작업자</option>
                </select>
            </div>
            
            <span>|</span>
            
            <div class="filter-group">
                <label for="facilitySelect">설비: </label> <select id="facilitySelect" class="filter-input"> <option value="전체">전체 설비</option>
                    <option value="전기">전기설비</option>
                    <option value="소방">소방설비</option>
                    <option value="기계">기계설비</option> 
                    <option value="통신">통신설비</option> 
                </select>
            </div>
            
            <button class="refresh-btn" onclick="applyFilters()" style="padding: 7px 15px; font-size: 13px;">
                <i class="fa-solid fa-magnifying-glass"></i> 검색
            </button>
        </div>

        <div id="loading-indicator" class="loading-view" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> 통합점검 데이터 분석 및 가공 중...
        </div>

        <div class="dashboard-grid">
            <div class="chart-card">
                <h3><i class="fas fa-chart-column"></i> 날짜별 설비 총 점검 횟수</h3>
                <div class="scrollable-chart-box-x" id="box-stacked">
                    <canvas id="stackedBarChart" style="display:block; height:100% !important;"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-bar"></i> 설비별 점검 횟수 Record Count</h3>
                <div class="scrollable-chart-box-y">
                    <div id="canvas-holder-y" style="width: 100%;">
                        <canvas id="horizontalBarChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fa-solid fa-table"></i> 통합점검기록 피봇 테이블</h3>
                <div class="table-wrapper">
                    <table class="pivot-table">
                        <thead>
                            <tr id="pivot-header">
                                <th>설비ID</th>
                                <th>점검 총 건수</th>
                            </tr>
                        </thead>
                        <tbody id="pivot-body"></tbody>
                    </table>
                </div>
            </div>

            <div class="chart-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <h3><i class="fa-solid fa-chart-pie"></i> 점검자별 설비 비율</h3>
                <div style="display: flex; justify-content: center; align-items: center; height: 300px;">
                    <canvas id="pieChart" style="max-width: 280px; max-height: 280px;"></canvas>
                </div>
            </div>
        </div>

        <div id="global-loader" class="fullscreen-loader" style="display:none;">
            <div class="loader-box">
                <div class="spinner-circle"></div>
                <p class="loader-text">통합점검 데이터 분석 및 가공 중...</p>
            </div>
        </div>
    </div>

    <script>
        const DATA_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKVil4NdXVPimQjQEFhUXouiQQkACZuXyjZRNimI5gwCDjPwTMLNf7QurylXwT8nZK/exec";
        const AUTH_URL = "https://script.google.com/macros/s/AKfycbwadQZXfGpQHMcMFRYp30-HuaTjkVsQ1goxnuaSXj-MgGzktUz0eoIhK7815T-y8mQF/exec"; 
        
        let chartInstances = {};
        let allRecords = []; 
        let userCenter = "";
        let lastKnownTime = 0; 
        
        Chart.register(ChartDataLabels);

        // [교정 1] 첫 로드 시 날짜 필터 깔끔하게 비우기 통합
        window.onload = function() {
            document.getElementById("startDate").value = ""; 
            document.getElementById("endDate").value = ""; 
        }

        // '선택 안 함' 버튼 작동 함수
        function resetDateFilter() {
            document.getElementById("startDate").value = "";
            document.getElementById("endDate").value = ""; 
        }
        
        async function authenticate() {
            const name = document.getElementById('loginName').value;
            const phone = document.getElementById('loginPhone').value;
            
            if(!name || !phone) {
                alert("이름과 전화번호를 모두 입력해주세요.");
                return;
            }
            
            const url = `${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&t=${Date.now()}`;
        
            try {
                const response = await fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store' });
                const res = await response.json();
                if (res.status === "SUCCESS") {
                    alert("로그인 성공! (" + res.center + " 소속)");
                    userCenter = res.center;
                    document.getElementById('dashboard-title').innerText = `[${res.center}] 시설물 점검 실시간 모니터링 현황판`;
                    document.getElementById('login-overlay').style.display = 'none';
                    loadDashboardData(); 
                } else {
                    alert("로그인 실패: 정보가 일치하지 않습니다.");
                }
            } catch (error) {
                console.error("로그인 통신 오류:", error); 
                alert("로그인 서버 통신 오류가 발생했습니다.");
            }
        }

        function loadDashboardData() {
            const loginOverlay = document.getElementById('login-overlay');
            const indicator = document.getElementById('loading-indicator');
            const globalLoader = document.getElementById('global-loader');

            if (loginOverlay && loginOverlay.style.display !== 'none') {
                if (indicator) { indicator.style.display = "none"; }
                if (globalLoader) { globalLoader.style.display = 'none'; }
            } else {
                if (indicator) { indicator.style.display = "block"; }
                if (globalLoader) { globalLoader.style.display = 'flex'; }
            }
            
            fetch(DATA_WEB_APP_URL, { mode: 'cors', cache: 'no-store' })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success" || res.status === "SUCCESS") {
                    const dataRecords = res.records || res.data || [];
                    
                    // 구글 시트 원본 데이터를 대시보드 규격 변수로 매칭
                    allRecords = dataRecords.map(r => ({
                        date: r.date || r["날짜"] || "",
                        inspector: r.inspector || r["점검자"] || r["작업자"] || "미지정",
                        fid: r.fid || r["설비ID"] || r["설비id"] || "알수없음" // 💡 과장님 데이터는 fid가 설비명입니다!
                    }));
                    
                    setFilterOptions(allRecords);
                    applyFilters(); 
                    if(res.lastUpdate) { lastKnownTime = res.lastUpdate; }
                } else {
                    alert("데이터 로드 실패: " + (res.message || "알 수 없는 오류"));
                }
            })
            .catch(err => {
                console.error("데이터 연동 오류:", err);
            })
            .finally(() => {
                const indicatorClose = document.getElementById('loading-indicator');
                const globalLoaderClose = document.getElementById('global-loader');
                if (indicatorClose) { indicatorClose.style.display = "none"; }
                if (globalLoaderClose) { globalLoaderClose.style.display = 'none'; }
            });
        }

        async function syncDashboard() {
            // 1. 로그인 창이 떠 있으면 동기화 패스 (이건 안전을 위해 필수입니다!)
            const loginOverlay = document.getElementById('login-overlay');
            if (loginOverlay && loginOverlay.style.display !== 'none') return;
            
            try {
                // 2. 구글 시트에서 최신 업데이트 시간만 살짝 찔러봅니다.
                const res = await fetch(DATA_WEB_APP_URL + "?t=" + Date.now(), { cache: 'no-store' }); 
                const json = await res.json();
                
                // 3. 마지막으로 받은 시간(lastKnownTime)과 서버의 시간이 다르면 강제 갱신!
                if (json.lastUpdate && json.lastUpdate !== lastKnownTime) {
                    console.log("새 데이터 발견! 대시보드 갱신...");
                    loadDashboardData(); 
                }
            } catch (err) {
                console.error("동기화 체크 오류:", err);
            }
        }
        
        // 60초마다 갱신 (이미 예전 코드에도 있으셨을 겁니다!)
        setInterval(syncDashboard, 60000);
        
        function setFilterOptions(records) {
            if (!records || records.length === 0) return;
            let inspectors = [...new Set(records.map(r => r.inspector))].filter(Boolean).sort();
            
            const insSelect = document.getElementById('filterInspector');
            const prevIns = insSelect.value;

            insSelect.innerHTML = '<option value="all">전체 작업자</option>';
            inspectors.forEach(ins => insSelect.innerHTML += `<option value="${ins}">${ins}</option>`);
            
            if([...insSelect.options].some(o => o.value === prevIns)) insSelect.value = prevIns;
        }

        // [교정 2 & 3] 에러 터지던 필터링 함수 완벽하게 수선 완료!
        function applyFilters() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const selectedInspector = document.getElementById('filterInspector').value;
            const selectedFacility = document.getElementById('facilitySelect').value; // 통합 설비 드롭다운 값

            let filtered = allRecords.filter(r => {
                // 날짜 정제 및 매칭 (날짜 선택 안 하면 무조건 패스)
                const rDate = r.date.replace(/[^0-9]/g, '-').substring(0, 10);
                const dateMatch = (!start || rDate >= start) && (!end || rDate <= end);
                
                // 작업자 매칭
                const inspectorMatch = (selectedInspector === "all" || r.inspector === selectedInspector);
                
                // 🔴 통합 설비 필터링 톱니바퀴 조율 (fid에 '전기', '소방' 등이 포함되어 있는지 검사)
                let facilityMatch = false;
                if (selectedFacility === "전체") {
                    facilityMatch = true; // '전체'면 무조건 통과
                } else {
                    facilityMatch = r.fid.includes(selectedFacility); // 드롭다운의 값(전기, 소방 등)이 포함되어 있으면 통과!
                }
                
                // 세 가지 조건이 모두 맞아야 최종 통과!
                return dateMatch && inspectorMatch && facilityMatch;
            });

            // 필터링된 진짜 데이터를 가지고 차트를 다시 그립니다!
            buildDashboard(filtered);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`전체화면 지원 안 함: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
        document.addEventListener("fullscreenchange", () => {
            const fsBtn = document.querySelector('[onclick="toggleFullScreen()"]');
            if (document.fullscreenElement) {
                fsBtn.innerHTML = '<i class="fa-solid fa-compress"></i> 전체화면 종료';
            } else {
                fsBtn.innerHTML = '<i class="fa-solid fa-expand"></i> 전체화면';
            }
        });
        
        function buildDashboard(records) {
            Object.keys(chartInstances).forEach(key => {
                if(chartInstances[key]) {
                    chartInstances[key].destroy();
                    chartInstances[key] = null;
                }
            });

            const palette = ['#3b82f6', '#f97316', '#a855f7', '#84cc16', '#06b6d4', '#eab308', '#ec4899', '#10b981', '#6366f1', '#f43f5e'];

            let dates = [...new Set(records.map(r => r.date))].filter(Boolean).sort();
            let fids = [...new Set(records.map(r => r.fid))].filter(Boolean).sort();
            let inspectors = [...new Set(records.map(r => r.inspector))].filter(Boolean).sort();
            
            const dateCount = dates.length;
            const fidCount = fids.length;

            // ----------------------------------------------------
            // [설계 반영] 1번 박스 제목에 조회된 '월' 표시하기
            // ----------------------------------------------------
            const firstCardTitle = document.querySelector('.chart-card h3');
            if (firstCardTitle && dates.length > 0) {
                // 모든 데이터의 월(MM)만 추출해서 중복 제거 후 정렬 (예: ['04', '05'])
                let monthsInQuery = [...new Set(dates.map(d => {
                    const m = d.match(/-(\d{2})-/);
                    return m ? m[1] : null;
                }))].filter(Boolean).sort();

                let monthText = "";
                if (monthsInQuery.length > 1) {
                    // 4월부터 5월까지 걸쳐있으면 -> "04월~05월"
                    monthText = `${monthsInQuery[0]}월~${monthsInQuery[monthsInQuery.length - 1]}월`;
                } else {
                    // 한 가지 월만 있으면 -> "05월"
                    monthText = `${monthsInQuery[0]}월`;
                }

                firstCardTitle.innerHTML = `<i class="fas fa-chart-column"></i> [${monthText}] ${userCenter} 설비 총 점검 횟수`;
            } else if (firstCardTitle) {
                firstCardTitle.innerHTML = `<i class="fas fa-chart-column"></i> [전체 누적] ${userCenter} 설비 총 점검 횟수`;
            }

            // ----------------------------------------------------
            // 1번 뷰: 날짜별 설비 총 점검 횟수 (가로축 '일'만 표시)
            // ----------------------------------------------------
            const stackedCanvas = document.getElementById('stackedBarChart');
            if (dateCount > 7) {
                stackedCanvas.style.width = (dateCount * 75) + "px";
            } else {
                stackedCanvas.style.width = "100%";
            }

            // 가로축 라벨을 "2026-05-20" -> "20일" 형태로만 깔끔하게 변경
            let customDateLabels = dates.map(dateStr => {
                if(!dateStr) return "";
                const match = dateStr.match(/-(\d{2})$/); // 날짜 끝자리 2자리 추출
                if(match) {
                    return parseInt(match[1], 10) + "일"; // "05일" -> "5일", "20일" -> "20일"
                }
                return dateStr;
            });

            let dateCounts = dates.map(date => records.filter(r => r.date === date).length);
            let dateColors = dates.map((_, idx) => palette[idx % palette.length]);

            chartInstances.stackedBarChart = new Chart(stackedCanvas, {
                type: 'bar',
                data: { 
                    labels: customDateLabels, // 가공된 'OO일' 라벨 적용
                    datasets: [{
                        label: '일일 총 점검 횟수',
                        data: dateCounts,
                        backgroundColor: dateColors,
                        borderRadius: 4
                    }] 
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    scales: { 
                        y: { beginAtZero: true, ticks: { stepSize: 1, color: '#64748b' }, grid: { color: '#f1f5f9' }, grace: '15%' },
                        x: { ticks: { color: '#64748b', maxRotation: 0, minRotation: 0 }, grid: { display: false } }
                    },
                    plugins: { 
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end', align: 'top', color: '#475569',
                            font: { weight: 'bold', size: 11 },
                            formatter: (val) => val > 0 ? val + '건' : ''
                        }
                    }
                }
            });

            // ----------------------------------------------------
            // 2번 뷰: 가로 막대 차트 무지개화 및 세로 스크롤
            // ----------------------------------------------------
            const horizontalCanvas = document.getElementById('horizontalBarChart');
            const canvasHolder = document.getElementById('canvas-holder-y');
            
            // 이제 종류별로 묶여서 개수가 몇 개 안 되므로 스크롤 없이 300px 고정!
            canvasHolder.style.height = "300px";

            // 1. 대분류 카테고리 정의 및 초기화
            const categories = {
                "🚨 소방설비": 0,
                "⚡ 전기설비": 0,
                "👣 순찰기록": 0,
                "⚙️ 기계/공조": 0,
                "🛠️ 기타설비": 0
            };

            // 2. 전체 레코드를 돌면서 FID 이름에 따라 대분류별로 합산(Group By)
            records.forEach(r => {
                const fid = r.fid || "";
                if (fid.includes('소방')) { categories["🚨 소방설비"]++; }
                else if (fid.includes('전기')) { categories["⚡ 전기설비"]++; }
                else if (fid.includes('순찰')) { categories["👣 순찰기록"]++; }
                else if (fid.includes('기계') || fid.includes('공조')) { categories["⚙️ 기계/공조"]++; }
                else { categories["🛠️ 기타설비"]++; }
            });

            // 3. 차트에 뿌릴 라벨과 데이터 배열 추출
            const categoryLabels = Object.keys(categories);
            const categoryData = Object.values(categories);

            // 각 막대마다 다른 색상이 적용되도록 팔레트 매핑
            let categoryColors = categoryLabels.map((_, idx) => palette[idx % palette.length]);

            chartInstances.horizontalBarChart = new Chart(horizontalCanvas, {
                type: 'bar',
                data: {
                    labels: categoryLabels, // 대분류 라벨 적용 (소방설비, 전기설비 등)
                    datasets: [{
                        data: categoryData,   // 합산된 데이터 적용
                        backgroundColor: categoryColors,
                        barThickness: 22,
                        borderRadius: 4
                    }] 
                },
                options: { 
                    indexAxis: 'y', 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { 
                        x: { beginAtZero: true, ticks: { stepSize: 1, color: '#64748b' }, grid: { color: '#f1f5f9' }, grace: '15%' },
                        y: { ticks: { color: '#1e293b', font: { weight: 'bold', size: 12 } }, grid: { display: false } }
                    },
                    plugins: { 
                        legend: { display: false }, 
                        datalabels: {
                            anchor: 'end', align: 'right', color: '#475569',
                            font: { weight: 'bold', size: 11 },
                            formatter: (val) => val > 0 ? val + '건' : ''
                        }
                    }
                }
            });

            // ----------------------------------------------------
            // 3번 뷰: 통합점검기록 피봇 테이블
            // ----------------------------------------------------
            const pivotBody = document.getElementById('pivot-body');
            let tableHtml = "";

            // [과장님 관리 구역] 설비ID별 매칭될 실제 위치나 상세 명칭을 적어주는 곳입니다.
            // 현장에 맞춰서 괄호 안의 내용을 언제든지 편하게 수정하시면 됩니다!
            const fidLocations = {
                "전기_01": "전기실",
                "전기_02": "발전기실",
                "소방_01": "1F_1구역_소화기",
                "소방_02": "1F_2구역_가스계 소화기",
                "소방_05": "1F_1구역_옥내소화전",
                "소방_06": "1F_2구역_옥외소화전",
                "소방_07": "3F_A구역_방화셔터",
                "소방_08": "3F_B구역_스프링클러",
                "소방_10": "3F_C구역_화재감지기",
                "순찰_01": "외곽 선로",
                "순찰_02": "옥상 공조실 주행"
            };

            fids.forEach(fid => {
                let totalCount = records.filter(r => r.fid === fid).length;
                
                // 정의해둔 위치 명칭이 있으면 가져오고, 없으면 빈칸 처리합니다.
                const locationText = fidLocations[fid] ? ` (${fidLocations[fid]})` : "";
                
                // 최종 출력: 설비ID (위치명) 형태로 테이블에 꽂아줍니다.
                tableHtml += `<tr>
                    <td style="font-weight:bold; color:#1e293b; text-align:left; padding-left:20px;">
                        ${fid}<span style="color:#64748b; font-weight:normal;">${locationText}</span>
                    </td>
                    <td style="font-weight:bold; color:#3b82f6;">${totalCount} 건</td>
                </tr>`;
            });
            
            pivotBody.innerHTML = tableHtml || `<tr><td colspan="2" style="color:#94a3b8; padding:40px;">일치하는 점검 데이터가 없습니다.</td></tr>`;

            // ----------------------------------------------------
            // 4번 뷰: 점검자별 비율 파이 차트
            // ----------------------------------------------------
            let inspectorData = inspectors.map(ins => records.filter(r => r.inspector === ins).length);
            let total = inspectorData.reduce((a, b) => a + b, 0); 
            const pieCanvas = document.getElementById('pieChart');

            chartInstances.pieChart = new Chart(pieCanvas, {
                type: 'pie',
                data: {
                    labels: inspectors,
                    datasets: [{
                        data: inspectorData,
                        backgroundColor: palette.slice(0, inspectors.length)
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        datalabels: {
                            color: '#ffffff',
                            font: { weight: 'bold', size: 11 },
                            formatter: function(value, context) {
                                if (total === 0) return '';
                                let percentage = ((value / total) * 100).toFixed(1);
                                if (percentage < 6) return ''; 
                                return context.chart.data.labels[context.dataIndex] + '\n' + percentage + '%';
                            },
                            align: 'center', anchor: 'center', textAlign: 'center'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw;
                                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0; 
                                    return ` ${context.label}: ${value}건 (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
